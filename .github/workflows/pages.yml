name: Publish dashboard to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "config/**"
      - "data/current.json"
      - "data/specifications.json"
      - "data/history/**"
      - "src/monitor_watch/dashboard.py"
      - "src/monitor_watch/scoring.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv and locked dependencies
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
      - run: uv sync --locked --all-extras
      - name: Read fail-closed publication approval
        id: flags
        run: uv run python -m monitor_watch.cli automation-output
      - name: Build approved publication
        if: steps.flags.outputs.publish_dashboard == 'true'
        run: |
          uv run python -m monitor_watch.cli dashboard
          uv run python -m monitor_watch.cli validate
      - name: Configure Pages
        if: steps.flags.outputs.publish_dashboard == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        if: steps.flags.outputs.publish_dashboard == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs
      - name: Deploy Pages
        if: steps.flags.outputs.publish_dashboard == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
