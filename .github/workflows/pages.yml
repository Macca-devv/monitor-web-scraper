name: Publish dashboard to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "config/**"
      - "data/current.json"
      - "data/specifications.json"
      - "data/history/**"
      - "src/monitor_watch/dashboard.py"
      - "src/monitor_watch/scoring.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv and locked dependencies
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --locked --all-extras
      - name: Read fail-closed publication approval
        id: flags
        run: uv run python -m monitor_watch.cli automation-output
      - name: Build approved publication
        if: steps.flags.outputs.publish_dashboard == 'true'
        run: |
          uv run python -m monitor_watch.cli dashboard
          uv run python -m monitor_watch.cli validate
      - name: Configure Pages
        if: steps.flags.outputs.publish_dashboard == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        if: steps.flags.outputs.publish_dashboard == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - name: Deploy Pages
        if: steps.flags.outputs.publish_dashboard == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
