name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Ruff formatting
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Strict type checking
        run: uv run mypy --strict src
      - name: Offline unit tests
        env:
          MONITOR_WATCH_TEST_NETWORK: blocked
        run: uv run pytest -q
      - name: Validate YAML and application configuration
        run: |
          uv run python -c "from pathlib import Path; import yaml; paths=list(Path('config').glob('*.yaml'))+list(Path('.github/workflows').glob('*.yml')); [yaml.safe_load(p.read_text(encoding='utf-8')) for p in paths]; print(f'validated {len(paths)} YAML files')"
          uv run python -m monitor_watch.cli validate
      - name: Build deterministic dashboard and verify committed output
        run: |
          uv run python -m monitor_watch.cli dashboard
          git diff --exit-code -- docs/data/dashboard.json
      - name: Reject unsafe generated dashboard constructs
        run: |
          if grep -R -n -E 'innerHTML|document\.write|eval\(' docs; then exit 1; fi
