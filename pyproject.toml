[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "monitor-watch-au"
version = "0.1.0"
description = "Australian monitor price and specification tracker"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4==4.13.4",
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.0",
  "types-PyYAML==6.0.12.20260724",
]

[project.scripts]
monitor-watch = "monitor_watch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/monitor_watch"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["monitor_watch"]
